server.port=8085
spring.application.name=gen_ai_training

client-openai-key: ${OPEN_AI_KEY}
client-openai-endpoint: ${OPEN_AI_ENDPOINT}
client-openai-deployment-name: ${OPEN_AI_DEPLOYMENT_NAME}

client-sk-temperature: 1.0
client-max-tokens: 512

model.allowFeatures.gpt-35-turbo = true
model.allowFeatures.gpt-4o-2024-05-13 = true
model.allowFeatures.Mixtral-8x7B-Instruct-v0.1 = false

embedding.deployment-name: text-embedding-ada-002
embedding.collection.name: textCollection
embedding.dating.collection.name: descriptionCollection
embedding.collection.size: 1536
embedding.results.limit: 5

qdrant.host: localhost
qdrant.port: 6334
qdrant.use-transport-layer-security: false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.url=${DB_URL}
spring.liquibase.user=${DB_USERNAME}
spring.liquibase.password=${DB_PASSWORD}